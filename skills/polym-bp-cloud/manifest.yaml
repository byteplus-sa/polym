name: polym-bp-cloud
version: 0.1.0
stage: experimental
owners:
  - wong.hing.fung.ai@

description_for_install: |
  Operate BytePlus/Volcengine cloud from Claude Code via the official `ve` CLI:
  query and provision ECS, VPC, CDN, API Gateway, container registry, CI/CD (CP),
  VKE, run commands on instances via Cloud Assistant, and TOS object storage via
  tosutil. Read-only by default; mutating actions require confirmation. Each user
  configures their own AK/SK profiles — no shared credentials.

depends_on:
  skills: []
  binaries:
    - ve: ">=1.0.48"
  env: []

io_contract:
  reads: []
  writes: []

triggers:
  - "list my ECS instances"
  - "provision a VM on BytePlus"
  - "run a command on that instance"
  - "check CDN domains"
  - "ve cli"
  - "byteplus cloud"

deprecates: []
